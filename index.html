<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joyeux Anniversaire Aya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500;1,600&family=Bebas+Neue&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0509;
    --bg2:#160810;
    --gold:#cda45e;
    --gold-bright:#e8c98a;
    --rose:#e64980;
    --rose-deep:#5c1a2e;
    --cream:#f7ece2;
    --line: rgba(205,164,94,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg) 70%);
    color: var(--cream);
    font-family:'Poppins', sans-serif;
    overflow-x:hidden;
    min-height:100vh;
  }

  /* ambient sparkle canvas */
  #sparkles{
    position:fixed; inset:0; pointer-events:none; z-index:1;
  }

  /* ---------- LOCK SCREEN ---------- */
  #lock{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 40%, #1a0a12, #0d0509 75%);
    transition: opacity 1.1s ease, visibility 1.1s ease;
    text-align:center;
    padding:24px;
  }
  #lock.hidden{ opacity:0; visibility:hidden; pointer-events:none; }

  .seal-wrap{
    width:150px; height:150px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    cursor:pointer;
    background: radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 55%, #7a5a25 100%);
    box-shadow: 0 0 40px rgba(205,164,94,0.35), inset 0 0 20px rgba(0,0,0,0.35);
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.045); }
  }
  .seal-wrap svg{ width:64px; height:64px; fill:#2a1608; }

  .seal-wrap.cracking{ animation:none; }
  .seal-wrap.cracking .shine{
    animation: shineSweep 0.7s ease forwards;
  }
  .shine{
    position:absolute; inset:0; border-radius:50%;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.85) 50%, transparent 70%);
    opacity:0;
  }
  @keyframes shineSweep{
    0%{ opacity:0; transform: translateX(-60%);}
    40%{ opacity:1; }
    100%{ opacity:0; transform: translateX(60%);}
  }

  .lock-title{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size: clamp(28px, 6vw, 44px);
    color: var(--gold-bright);
    margin-top:28px;
    letter-spacing:0.5px;
  }
  .lock-sub{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:4px;
    font-size:13px;
    color: var(--rose);
    margin-top:14px;
    opacity:0.9;
  }

  /* ---------- MAIN CONTENT ---------- */
  #content{
    position:relative; z-index:2;
    max-width:640px; margin:0 auto;
    padding: 90px 24px 60px;
  }

  .eyebrow{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:5px;
    font-size:13px;
    color: var(--rose);
    text-align:center;
  }
  h1.big{
    font-family:'Bebas Neue', sans-serif;
    font-size: clamp(42px, 11vw, 74px);
    text-align:center;
    letter-spacing:2px;
    line-height:1;
    margin-top:10px;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold) 60%, var(--rose) 130%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow: 0 0 30px rgba(205,164,94,0.25);
  }
  .divider{
    width:70px; height:1px; background:var(--line);
    margin:34px auto;
  }

  .letter{
    font-family:'Cormorant Garamond', serif;
    font-size: clamp(19px, 3.4vw, 23px);
    line-height:1.85;
    font-weight:400;
    color: var(--cream);
  }
  .letter p{
    margin-bottom:22px;
    opacity:0;
    transform: translateY(14px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .letter p.show{ opacity:1; transform:translateY(0); }
  .letter .signoff{
    font-style:italic;
    color: var(--gold-bright);
  }

  /* ---------- PHOTO ---------- */
  .frame{
    margin: 60px auto 20px;
    max-width:420px;
    padding:14px;
    background: linear-gradient(160deg, var(--gold), #7a5a25);
    border-radius:6px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55);
    transform: rotate(-2deg);
    opacity:0;
    transform: rotate(-2deg) translateY(20px);
    transition: opacity 1s ease, transform 1s ease;
  }
  .frame.show{ opacity:1; transform: rotate(-2deg) translateY(0); }
  .frame img{
    width:100%; display:block; border-radius:2px;
  }
  .frame .cap{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    text-align:center;
    color:#2a1608;
    padding-top:10px;
    font-size:15px;
  }

  /* ---------- FOOTER ---------- */
  .closing{
    text-align:center;
    margin-top:80px;
  }
  .closing .word{
    font-family:'Bebas Neue', sans-serif;
    font-size: clamp(30px, 7vw, 46px);
    letter-spacing:3px;
    color: var(--rose);
  }
  .hearts{
    margin-top:18px;
    font-size:20px;
    letter-spacing:8px;
    color: var(--gold-bright);
  }

  .player{
    position:fixed;
    bottom:18px; left:50%; transform:translateX(-50%);
    z-index:40;
    display:flex; align-items:center; gap:10px;
    background: rgba(13,5,9,0.75);
    border:1px solid var(--line);
    backdrop-filter: blur(6px);
    padding:8px 16px;
    border-radius:30px;
    font-family:'Poppins', sans-serif;
    font-size:12px;
    color:var(--cream);
    opacity:0;
    transition: opacity 0.8s ease;
  }
  .player.show{ opacity:1; }
  .player button{
    background:none; border:none; cursor:pointer;
    color: var(--gold-bright);
    font-size:16px;
    line-height:1;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<canvas id="sparkles"></canvas>

<div id="lock">
  <div class="seal-wrap" id="sealBtn">
    <div class="shine"></div>
    <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.2C.4 8.6 2 5 5.5 5c2 0 3.3 1 4.5 2.4C11.2 6 12.5 5 14.5 5 18 5 19.6 8.6 22 11.8 19.5 16.4 12 21 12 21z"/></svg>
  </div>
  <div class="lock-title">pour Aya</div>
  <div class="lock-sub">TOUCHE LE SCEAU POUR OUVRIR</div>
</div>

<div id="content">
  <div class="eyebrow">25 août</div>
  <h1 class="big">JOYEUX<br>ANNIVERSAIRE</h1>
  <div class="divider"></div>

  <div class="letter" id="letter"></div>

  <div class="frame" id="frame">
    <img src="photo1.jpeg" alt="Aya et Nacer">
    <div class="cap">nous deux, comme toujours</div>
  </div>

  <div class="closing">
    <div class="word">JE T'AIME INFINIMENT</div>
    <div class="hearts">❤ ❤ ❤ ❤ ❤</div>
  </div>
</div>

<audio id="audio" src="musique.mp3" loop></audio>
<div class="player" id="player">
  <button id="playBtn">❚❚</button>
  <span>musique</span>
</div>

<script>
// ---------- Sparkle ambient background ----------
const canvas = document.getElementById('sparkles');
const ctx = canvas.getContext('2d');
let w,h,particles=[];
function resize(){ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; }
resize(); window.addEventListener('resize', resize);

function makeParticles(n){
  particles = [];
  for(let i=0;i<n;i++){
    particles.push({
      x: Math.random()*w,
      y: Math.random()*h,
      r: Math.random()*1.6+0.4,
      s: Math.random()*0.35+0.1,
      o: Math.random()*0.6+0.2
    });
  }
}
makeParticles(70);

function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#e8c98a';
  particles.forEach(p=>{
    ctx.globalAlpha = p.o * (0.5 + 0.5*Math.sin(Date.now()/900 + p.x));
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    p.y += p.s;
    if(p.y > h){ p.y = -5; p.x = Math.random()*w; }
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
draw();

// ---------- Letter text (fade in progressively) ----------
const letterText = [
  "Aya, impressionnant comme le temps passe si vite. Nous voilà encore une fois réunis, malgré la distance, le jour de ton anniversaire.",
  "Cette fois-ci c'est particulier : on ne se voit ni demain, ni aujourd'hui, ni après-demain. Ça fait mal au cœur, mais c'est comme ça. Cela n'empêche en rien ce que je ressens pour toi.",
  "Je t'aime infiniment, mon amour. Je te souhaite tout le bonheur, tu le mérites. Que cette nouvelle année soit pleine de bons moments.",
  "Je te souhaite aussi de réussir cette année scolaire — et maintenant professionnelle aussi, hahahaha 😂",
  "Prends soin de toi et que toute ta famille pète la forme. Y'a que ça qui compte, la santé — tout le reste itwakhlaf.",
  "Je t'aime de tout mon cœur. J'espère qu'on se reverra bientôt.",
  "Joyeux anniversaire, mon bébé d'amour."
];

const letterEl = document.getElementById('letter');
letterText.forEach(t=>{
  const p = document.createElement('p');
  p.textContent = t;
  letterEl.appendChild(p);
});
const signoff = document.createElement('p');
signoff.className = 'signoff';
signoff.textContent = "Je t'aime infiniment, mon chouchou. Je t'aimerai pour toujours. ❤";
letterEl.appendChild(signoff);

// ---------- Reveal on open ----------
const seal = document.getElementById('sealBtn');
const lock = document.getElementById('lock');
const audio = document.getElementById('audio');
const player = document.getElementById('player');
const playBtn = document.getElementById('playBtn');
let opened = false;

seal.addEventListener('click', () => {
  if(opened) return;
  opened = true;
  seal.classList.add('cracking');
  audio.play().catch(()=>{});
  setTimeout(()=>{
    lock.classList.add('hidden');
    player.classList.add('show');
    revealParagraphs();
  }, 550);
});

function revealParagraphs(){
  const paras = document.querySelectorAll('.letter p');
  paras.forEach((p, i)=>{
    setTimeout(()=> p.classList.add('show'), 400 + i*650);
  });
  const frameDelay = 400 + paras.length*650 + 300;
  setTimeout(()=> document.getElementById('frame').classList.add('show'), frameDelay);
}

playBtn.addEventListener('click', ()=>{
  if(audio.paused){ audio.play(); playBtn.textContent='❚❚'; }
  else { audio.pause(); playBtn.textContent='▶'; }
});
</script>

</body>
</html>
